<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title desc"><title id="title">Delta table file retention</title><desc id="desc">The transaction log references current files while old files become eligible for vacuum after the retention period.</desc><rect width="760" height="200" rx="16" fill="#eef3f8"/><text x="30" y="45" font-family="sans-serif" font-size="20" fill="#263b4a">Delta transaction log</text><path d="M240 40h90" stroke="#526b7a" stroke-width="3"/><text x="350" y="45" font-family="sans-serif" font-size="20" fill="#263b4a">Current files: retained</text><path d="M240 40v95h90" fill="none" stroke="#526b7a" stroke-width="3" stroke-dasharray="6 5"/><text x="350" y="128" font-family="sans-serif" font-size="20" fill="#263b4a">Obsolete files: eligible after</text><text x="350" y="158" font-family="sans-serif" font-size="20" fill="#263b4a">the retention threshold</text></svg>